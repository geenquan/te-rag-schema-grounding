[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terag-public"
description = "TE-RAG: Historical Domain Annotations for Enterprise Schema Grounding — public release of the implementation and evaluation protocols"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = {text = "TBD — see LICENSE and NOTICE before the license is finalized"}  # placeholder until the owner decides
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "networkx>=3.0",
    "jieba>=0.42",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "sqlglot>=25.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
statistics = ["scipy>=1.11"]
dense = ["torch>=2.0", "transformers>=4.30"]
api = ["openai>=1.30"]
plots = ["matplotlib>=3.7"]

[project.scripts]
terag-release = "terag_release.cli:main"

[tool.setuptools.dynamic]
version = {attr = "terag_release.__version__"}

[tool.setuptools.packages.find]
# Discovery (not a fixed list) so subpackages — in particular the frozen
# final-paper engine tree terag.engines.* — ship with the wheel; the legacy
# top-level packages and the pinned third-party snapshot under
# retrievers/upstream (a namespace dir without __init__) are included via
# the patterns below.
include = ["terag*", "terag_release*", "retrievers*", "eval*", "datasets*", "analysis*", "experiment*"]

[tool.setuptools.package-data]
# Pinned third-party sources and their MIT licenses must ship with any
# binary distribution (retrievers/upstream is a namespace package).
retrievers = ["upstream/*", "README.md"]
