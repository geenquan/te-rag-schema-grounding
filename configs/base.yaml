# Base configuration shared by every TE-RAG run.
#
# Values below are the paper's fixed algorithm parameters (tag
# paper-dasfaa2027-v1.0, accepted algorithm identity `transfer_v3_target_cap`).
# They are NOT tunable hyper-parameters of the paper: ranking weights,
# thresholds, and caps were fixed before evaluation. Do not change them when
# reproducing the paper protocol.
#
# Dataset-specific values (paths, tokenizer language, domain keyword lists)
# live in configs/datasets/*.yaml; protocol settings in configs/protocols/;
# per-method overrides in configs/methods/.

terag:
  version: 1.0.0
  seed: 42

  tokenizer:
    # chinese = jieba segmentation; english = regex tokenizer.
    # The active language is chosen by the dataset config.
    default: chinese

  index:
    bm25:
      k1: 1.5
      b: 0.75
    # Compound table-document weights (paper Eq. doc_construction).
    field_weights:
      table_name: 2.0
      table_desc: 1.5
      field_name: 1.0
      field_desc: 0.8
      pattern: 0.5
    include_field_desc: true

  graph:
    # Strongest SQL role wins on each query-element edge (max, not sum).
    role_weights:
      SELECT: 1.2
      WHERE: 2.0
      JOIN: 1.8
      GROUP_BY: 1.5
      ORDER_BY: 1.3
      HAVING: 1.4
      FROM: 1.0
    parse_mode: ast            # sqlglot AST; 'regex' exists only as a fallback

  pattern_mining:
    # 'keywords' mines entity/attribute/time/aggregation keyword patterns from
    # training questions and needs DOMAIN keyword lists supplied by the dataset
    # config (the paper's lists belong to the private enterprise domain and are
    # not redistributed). An empty list simply yields no keyword patterns.
    mode: keywords
    entity_keywords: []
    attribute_keywords: []
    aggregation_keywords: {}
    time_patterns: []
    similarity_threshold: 0.3
    min_pattern_count: 1

  feature:
    # Fixed table ranking weights (paper Eq. table_score).
    table_weights:
      bm25_score: 0.35
      graph_score: 0.35
      pattern_score: 0.30
    # Fixed column ranking weights (paper Eq. column_score_full).
    # role_prior is the independent keyword-pattern score (paper name s_pat),
    # NOT SQL-role alignment. annotation_hit is the B/C column TERM hit
    # feature; its per-hit reward w_ann=0.5 is fixed inside the feature
    # extractor, lambda_ann (this weight) is separate.
    field_weights:
      direct_match: 0.40
      graph_propagation: 0.20
      role_prior: 0.15
      train_recommend: 0.25
      annotation_hit: 1.0
    graph_propagation_threshold: 0.15
    train_similarity_threshold: 0.30
    graph_propagation_weight: 3.0
    template_match_weight: 0.6
    direct_match_multiplier: 1.5
    field_name_match_bonus: 0.4
    field_graph_score_cap: 5.0
    train_recommend_multiplier: 1.5
    train_recommend_cap: 3.0

  annotations:
    # B/C channels default OFF for backwards compatibility; the formal Full
    # configuration enables them explicitly (configs/methods/terag_full.yaml).
    use_history: false        # B: direct annotations from training SQL
    use_transfer: false       # C: constrained one-hop transfer (needs B)
    use_annotation_index: true

  ablation:
    use_graph_weight: true
    use_template_mining: true
    use_pattern_generalization: true
    use_enhanced_index: true
    use_role_parser: true
    use_role_weight: true

  evaluation:
    table_k: [1, 3, 5, 10]
    column_k: [5, 10, 20]

# Fixed transfer-admission parameters (paper Sec. 3.5). These are the
# defaults of TransferConfig in retrievers/annotation_transfer.py and are part
# of the accepted algorithm identity; they are listed here for documentation
# and are consumed programmatically (not re-wired through YAML):
transfer_defaults:
  min_total_sim: 0.5            # minimum total similarity for acceptance
  schema_only_min: 0.5          # separate gate when template evidence is missing (degraded)
  context_min: 0.3              # TERM table-context similarity gate
  max_sources_per_target: 3     # top-kappa_s candidate sources per target
  max_annotations_per_target: 3 # cap kappa_a per normalized physical target column
  max_texts_per_table: 8        # cap kappa_t distinct C texts per table

# Output budget used by every protocol (paper: 5 tables, 10 columns/table).
budget:
  max_tables: 5
  max_columns_per_table: 10

runtime:
  # New output directories are always required; runs never overwrite.
  forbid_overwrite: true
  record_config_sha256: true
