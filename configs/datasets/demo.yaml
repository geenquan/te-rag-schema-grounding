# Bundled synthetic demo dataset ("Aurora Logistics"), generated by
# demo/generator.py. Fictional tables/questions/SQL; no enterprise content.
# The demo exercises the SAME production code path as private data.

name: demo
extends: null

data:
  field_csv: demo/data/field_schema.csv
  table_csv: demo/data/table_schema.csv
  qa_csv: demo/data/qa_data.csv
  gold: demo/data/full_gold_v2.jsonl     # built by scripts/build_full_gold.py

terag:
  tokenizer:
    default: chinese      # demo questions are Chinese to exercise jieba paths
  pattern_mining:
    mode: keywords
    # Synthetic-domain keyword lists (algorithm INPUT data, kept in Chinese on
    # purpose: they must match the language of the questions).
    entity_keywords: [仓库, 网点, 客户, 供应商, 运单, 车队]
    attribute_keywords: [库存, 运费, 件数, 重量, 营收, 时效, 签收率]
    aggregation_keywords:
      多少: VALUE
      哪些: LIST
      总计: SUM
      合计: SUM
      平均: AVG
      最大: MAX
      最小: MIN
      数量: COUNT
    time_patterns:
      - ['\d{4}年\d{1,2}月', YEAR_MONTH]
      - ['\d{4}年', YEAR]
      - ['\d{1,2}月', MONTH]
      - [今年, THIS_YEAR]
      - [去年, LAST_YEAR]
      - [上月, LAST_MONTH]

sql:
  dialect: mysql

notes: >
  Demo questions are intentionally Chinese so the original segmentation and
  keyword-pattern logic runs unchanged; English glosses are included in
  demo/README.md. See docs/data_format.md for the input contract.
